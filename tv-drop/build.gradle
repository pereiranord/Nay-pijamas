plugins {
    id 'com.android.application' version '8.13.2'
}

def media3 = '1.9.0'

android {
    namespace 'com.pereiranord.tvdrop'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pereiranord.tvdrop'
        minSdk 26
        // Play Protect warns about apps that target an Android version more than two levels below the current one.
        targetSdk 35
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName System.getenv('VERSION_NAME') ?: '1.0'
        // TVs often run 32-bit Android even on 64-bit chips, so ship both.
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
    }

    // Keep the simple folder layout: AndroidManifest.xml, src/, res/, assets/.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
        test {
            java.srcDirs = ['test']
        }
        // The phone build only removes what the phone never uses (see flavors/celular/AndroidManifest.xml).
        celular {
            manifest.srcFile 'flavors/celular/AndroidManifest.xml'
        }
    }

    // Two APKs of the same app: same package name, same signature, same code.
    //   tv      - everything (installed on the TV with adb, as always): build/TV-Drop.apk
    //   celular - without the TV-only parts, so it can be downloaded and installed on a phone with
    //             Google Play Protect on: build/TV-Drop-Celular.apk
    flavorDimensions 'device'
    productFlavors {
        tv { dimension 'device' }
        celular { dimension 'device' }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE') ?: 'keystore/tvdrop.jks')
            storePassword System.getenv('KS_PASS') ?: 'tvdrop123'
            keyAlias 'tvdrop'
            keyPassword System.getenv('KS_PASS') ?: 'tvdrop123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // AGP normally adds an encrypted list of dependencies to the APK's signing block (for the Play Console).
    // It is random on every build, so the same code would give a different file; without it the APK is
    // reproducible: the same commit always gives the same SHA-256.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // ExoPlayer: hardware video decoding (full quality, HDR), HLS, Range-based HTTP streaming.
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // FFmpeg audio decoders (DTS, DTS-HD core, Dolby TrueHD, AC3, E-AC3...) for audio the TV can't decode.
    implementation "org.jellyfin.media3:media3-ffmpeg-decoder:$media3+1"
    // QR code shown on the TV for pairing.
    implementation "com.google.zxing:core:3.5.3"
    // QR code scanner in the phone app (Google Play services; TV Drop needs no camera permission).
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"

    testImplementation "junit:junit:4.13.2"
    // Real org.json for JVM tests (Android's copy is a stub off-device).
    testImplementation "org.json:json:20240303"
}
