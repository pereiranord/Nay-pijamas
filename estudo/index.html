<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nay Estudos</title>
<meta name="description" content="Estude inglês com trilha, XP, ofensiva e vidas — com as suas próprias questões.">
<meta name="theme-color" content="#ff4f9a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root{
  --pink:#ff4f9a;--pink-d:#d6337c;--pink-l:#ffe3f0;--pink-ll:#fff4f9;
  --green:#2fbf71;--green-d:#1f9a58;--green-l:#d7f8e6;
  --red:#ff4b4b;--red-d:#d93636;--red-l:#ffe1e1;
  --gold:#ffc800;--gold-d:#e0a800;--blue:#1cb0f6;--purple:#a560ff;--purple-l:#efe3ff;
  --bg:#ffffff;--card:#ffffff;--text:#3c3c3c;--muted:#8a8a8a;--line:#ececec;--lock:#e5e5e5;--lock-d:#c8c8c8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#17131a;--card:#221c26;--text:#f3eaf0;--muted:#a597a0;--line:#352c3a;--lock:#3a3140;--lock-d:#2a2230;--pink-l:#4a1f35;--pink-ll:#2a1823;--green-l:#173d29;--red-l:#4a2020;--purple-l:#33224a}
}
:root[data-theme="dark"]{--bg:#17131a;--card:#221c26;--text:#f3eaf0;--muted:#a597a0;--line:#352c3a;--lock:#3a3140;--lock-d:#2a2230;--pink-l:#4a1f35;--pink-ll:#2a1823;--green-l:#173d29;--red-l:#4a2020;--purple-l:#33224a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;overscroll-behavior-y:none}
button{font-family:inherit;font-weight:800;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100%;position:relative}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:16px;letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--pink);box-shadow:0 4px 0 var(--pink-d);transition:transform .05s,box-shadow .05s}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--pink-d)}
.btn[disabled]{background:var(--lock);color:var(--muted);box-shadow:0 4px 0 var(--lock-d);cursor:default}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.purple{background:var(--purple);box-shadow:0 4px 0 #7c3fd0}
.btn.ghost{background:transparent;color:var(--pink);box-shadow:none;border:2px solid var(--line)}
.btn.small{padding:10px 14px;font-size:13px;border-radius:12px;width:auto;display:inline-block}
.muted{color:var(--muted)}
.center{text-align:center}
/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 16px calc(10px);border-bottom:2px solid var(--line)}
.stat{display:flex;align-items:center;gap:5px;font-size:17px;font-weight:900;background:none;border:0;color:var(--text);padding:4px}
.stat .ic{font-size:21px}
.stat.fire{color:#ff9600}.stat.gem{color:var(--blue)}.stat.heart{color:var(--red)}.stat.cold{color:var(--muted);filter:grayscale(1)}
/* tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--bg);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs-in{display:flex;max-width:560px;width:100%;justify-content:space-around}
.tab{flex:1;background:none;border:0;padding:8px 0 10px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:12px;margin:4px}
.tab .ti{font-size:24px;filter:grayscale(.9);opacity:.75}
.tab.on{color:var(--pink);background:var(--pink-ll);outline:2px solid var(--pink-l)}
.tab.on .ti{filter:none;opacity:1}
.page{padding:16px 16px 110px}
/* path */
.unit{border-radius:16px;color:#fff;padding:16px 18px;margin:18px 0 8px;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.unit h2{margin:0;font-size:20px;font-weight:900}
.unit p{margin:4px 0 0;font-size:14px;opacity:.92}
.unit .ubar{height:8px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:8px;overflow:hidden}
.unit .ubar i{display:block;height:100%;background:#fff;border-radius:9px}
.path{display:flex;flex-direction:column;align-items:center;padding:10px 0}
.nodewrap{position:relative;margin:9px 0;display:flex;flex-direction:column;align-items:center}
.node{width:72px;height:66px;border-radius:50%;border:0;font-size:28px;color:#fff;background:var(--pink);box-shadow:0 7px 0 var(--pink-d);position:relative;display:flex;align-items:center;justify-content:center}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--pink-d)}
.node.done{background:var(--gold);box-shadow:0 7px 0 var(--gold-d)}
.node.locked{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--muted)}
.node.current::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--pink-l);animation:pulse 1.6s infinite}
@keyframes pulse{50%{inset:-14px;opacity:.5}}
.node .stars{position:absolute;bottom:-26px;font-size:13px;letter-spacing:-1px;white-space:nowrap}
.start-bubble{position:absolute;top:-44px;background:var(--card);color:var(--pink);border:2px solid var(--line);padding:6px 12px;border-radius:12px;font-size:13px;text-transform:uppercase;white-space:nowrap;animation:bob 1.2s infinite ease-in-out;z-index:2}
.start-bubble::after{content:"";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%) rotate(45deg);width:12px;height:12px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line)}
@keyframes bob{50%{transform:translateY(-5px)}}
.nlabel{font-size:12px;color:var(--muted);margin-top:30px;max-width:150px;text-align:center;line-height:1.2}
.trophy{font-size:44px;margin:14px 0 4px;filter:grayscale(1);opacity:.5}
.trophy.on{filter:none;opacity:1}
/* popover */
.pop{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.35);animation:fade .15s}
.pop .sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));animation:up .2s}
.pop.mid{align-items:center;padding:16px}
.pop.mid .sheet{border-radius:22px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{margin:0 0 6px;font-size:21px;font-weight:900}
.sheet .row{display:flex;gap:10px;margin-top:14px}
.sheet .row .btn{flex:1}
/* cards */
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.card h3{margin:0 0 8px;font-size:18px;font-weight:900}
.h1{font-size:24px;font-weight:900;margin:6px 0 4px}
.bar{height:16px;background:var(--line);border-radius:10px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--pink);border-radius:10px;transition:width .4s;position:relative}
.bar i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.bar.gold i{background:var(--gold)}
.quest{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.quest:last-child{border-bottom:0}
.quest .qi{font-size:32px}
.quest .qb{flex:1}
.quest .qb .bar{height:14px;margin-top:6px}
.quest .qt{font-size:15px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center}
.mini .mi{font-size:26px}
.mini b{display:block;font-size:18px;font-weight:900}
.mini span{font-size:12px;color:var(--muted)}
.ach{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:2px solid var(--line)}
.ach:last-child{border-bottom:0}
.ach .ai{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--pink-l);flex:none}
.ach.off .ai{filter:grayscale(1);opacity:.45;background:var(--line)}
.ach.off{color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--line);color:var(--muted)}
.cal .d.on{background:#ff9600;color:#fff}
.cal .d.fz{background:var(--blue);color:#fff}
.cal .d.today{outline:3px solid var(--pink)}
.weekbars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.weekbars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--muted)}
.weekbars i{display:block;width:100%;background:var(--pink);border-radius:6px 6px 2px 2px;min-height:3px}
.shopitem{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:2px solid var(--line)}
.shopitem:last-child{border-bottom:0}
.shopitem .si{font-size:38px}
.shopitem .sb{flex:1}
.shopitem .sb small{display:block;color:var(--muted);font-weight:700}
.price{color:var(--blue);font-weight:900;white-space:nowrap}
.setting{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:2px solid var(--line)}
.setting:last-child{border-bottom:0}
.switch{width:52px;height:30px;border-radius:20px;background:var(--lock);border:0;position:relative;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--pink)}
.switch.on::after{left:25px}
select,input[type=time],input[type=text]{font-family:inherit;font-weight:800;font-size:15px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--text)}
/* lesson */
.lesson{min-height:100vh;display:flex;flex-direction:column}
.lhead{display:flex;align-items:center;gap:12px;padding:16px}
.xbtn{background:none;border:0;font-size:26px;color:var(--muted);padding:0 4px;line-height:1}
.lhead .bar{flex:1}
.lbody{flex:1;padding:6px 16px 200px}
.qkind{font-size:13px;text-transform:uppercase;color:var(--purple);letter-spacing:.5px}
.qtext{font-size:20px;line-height:1.4;font-weight:800;margin:6px 0 16px;overflow-wrap:anywhere}
.qtext p{margin:0 0 8px}
.qtext img{max-width:100%;border-radius:12px}
.audio-btn{display:flex;align-items:center;gap:12px;background:var(--blue);color:#fff;border:0;border-radius:16px;padding:14px 18px;font-size:16px;box-shadow:0 4px 0 #1590c9;margin:6px 0 16px}
.audio-btn .ai{font-size:26px}
.audio-btn.slow{background:var(--card);color:var(--blue);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:14px 14px;font-size:16px;font-weight:700;display:flex;gap:12px;align-items:center;line-height:1.35;overflow-wrap:anywhere}
.opt .k{flex:none;width:30px;height:30px;border:2px solid var(--line);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted)}
.opt img{max-width:100%;max-height:160px;border-radius:10px}
.opt.sel{border-color:var(--pink);background:var(--pink-ll);color:var(--pink-d)}
.opt.sel .k{border-color:var(--pink);color:var(--pink)}
.opt.right{border-color:var(--green);background:var(--green-l)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt[disabled]{cursor:default}
.combo{text-align:center;color:#ff9600;font-weight:900;font-size:15px;min-height:22px;margin-bottom:6px}
.lfoot{position:fixed;left:0;right:0;bottom:0;z-index:40;border-top:2px solid var(--line);background:var(--bg);padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.lfoot-in{max-width:528px;margin:0 auto}
.lfoot.ok{background:var(--green-l);border-color:transparent}
.lfoot.bad{background:var(--red-l);border-color:transparent}
.lfoot.neu{background:var(--purple-l);border-color:transparent}
.fb-title{font-size:21px;font-weight:900;display:flex;align-items:center;gap:8px;margin-bottom:4px}
.lfoot.ok .fb-title{color:var(--green-d)}.lfoot.bad .fb-title{color:var(--red-d)}.lfoot.neu .fb-title{color:var(--purple)}
.fb-text{font-size:15px;margin-bottom:12px;line-height:1.35}
.linkbtn{background:none;border:0;color:var(--purple);text-decoration:underline;font-size:14px;padding:0;margin:0 0 12px}
/* result */
.result{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px 40px;text-align:center}
.result .big{font-size:84px;animation:pop .5s}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}}
.result h1{color:var(--gold-d);font-size:28px;font-weight:900;margin:10px 0}
.rstats{display:flex;gap:10px;margin:18px 0 26px;width:100%}
.rstat{flex:1;border:2px solid;border-radius:16px;overflow:hidden}
.rstat .rt{color:#fff;font-size:12px;padding:5px;text-transform:uppercase}
.rstat .rv{font-size:21px;font-weight:900;padding:12px 4px}
.rstat.x{border-color:var(--gold)}.rstat.x .rt{background:var(--gold)}.rstat.x .rv{color:var(--gold-d)}
.rstat.a{border-color:var(--green)}.rstat.a .rt{background:var(--green)}.rstat.a .rv{color:var(--green)}
.rstat.t{border-color:var(--blue)}.rstat.t .rt{background:var(--blue)}.rstat.t .rv{color:var(--blue)}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:100}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:120;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 16px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.15);animation:tin .3s;max-width:calc(100% - 32px)}
@keyframes tin{from{transform:translate(-50%,-30px);opacity:0}}
.drop{border:3px dashed var(--pink);border-radius:20px;padding:26px 16px;text-align:center;background:var(--pink-ll)}
.mascot{font-size:80px;line-height:1}
.banner{background:var(--pink-ll);border:2px solid var(--pink-l);border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:center;margin:8px 0}
.banner b{color:var(--pink-d)}
.spin{width:44px;height:44px;border:5px solid var(--pink-l);border-top-color:var(--pink);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.goalopt{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:14px;margin:8px 0;background:var(--card);color:var(--text);width:100%;font-size:16px}
.goalopt.sel{border-color:var(--pink);background:var(--pink-ll);color:var(--pink-d)}
.fab-continue{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:25}
@media (min-width:600px){.fab-continue{right:calc(50% - 264px)}}
</style>

<body>
<div id="app"><div class="spin"></div></div>
<canvas id="confetti" hidden></canvas>
<script src="vendor/jszip.min.js"></script>
<script>
'use strict';
/* =========================================================
   Nay Estudos — app de estudo estilo trilha (PWA)
   O conteúdo do curso é importado pelo usuário e fica só
   no aparelho (IndexedDB). Nada é enviado a servidores.
   ========================================================= */

const KEY = 'nayEstudos.v1';
const MAX_HEARTS = 5, HEART_MS = 30 * 60 * 1000;
const UNIT_COLORS = ['#ff4f9a','#a560ff','#ff7a59','#1cb0f6','#e0479e','#2fbf71','#ff9600','#7a5cff','#ff5c8a','#00b5a3','#c552e0','#f06292','#5b8cff','#ff6f61','#9b59b6','#26a69a','#ec407a','#8e7cc3','#ff8a65','#4fc3f7'];
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------------- storage ---------------- */
const db = {
  _p: null,
  open() {
    if (this._p) return this._p;
    this._p = new Promise((res, rej) => {
      const r = indexedDB.open('nayEstudos', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this._p;
  },
  async get(k) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); }); },
  async set(k, v) { const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
  async del(k) { const d = await this.open(); return new Promise((res) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = res; t.onerror = res; }); }
};

function defaultState() {
  return { v: 1, name: '', goal: 20, xp: 0, gems: 50, hearts: MAX_HEARTS, heartsAt: Date.now(), unlimited: false, unlockAll: false,
    streak: 0, best: 0, last: null, freezes: 0, frozenDays: [], days: {}, lessons: {}, mistakes: {}, userKeys: {}, ach: {},
    quests: null, boostUntil: 0, sound: true, theme: 'auto', perfect: 0, lessonsDone: 0, bestCombo: 0, answered: 0, correct: 0,
    reminder: { on: false, time: '19:00' }, created: Date.now() };
}
let S = defaultState();
function loadState() { try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(defaultState(), JSON.parse(raw)); } catch (e) {} }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
  db.set('state', S).catch(() => {});
  db.set('meta', { last: S.last, streak: effStreak(), reminder: S.reminder, goal: S.goal, todayXp: S.days[today()] || 0 }).catch(() => {});
  updateBadge();
}

/* ---------------- dates ---------------- */
const dkey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const today = () => dkey(new Date());
const addDays = (k, n) => { const [y, m, d] = k.split('-').map(Number); return dkey(new Date(y, m - 1, d + n)); };
const daysBetween = (a, b) => { const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 864e5); };

function effStreak() {
  if (!S.last) return 0;
  const gap = daysBetween(S.last, today());
  if (gap <= 1) return S.streak;
  return (gap - 1) <= S.freezes ? S.streak : 0;
}
/* Called when the app opens: consume freezes for missed days or reset. */
function settleStreak() {
  if (!S.last) return;
  const gap = daysBetween(S.last, today());
  if (gap <= 1) return;
  const missed = gap - 1;
  if (missed <= S.freezes) {
    S.freezes -= missed;
    for (let i = 1; i <= missed; i++) S.frozenDays.push(addDays(S.last, i));
    S.last = addDays(today(), -1); // streak preserved, today still pending
    toastLater.push(['🧊', `Protetor de ofensiva usado (${missed} dia${missed > 1 ? 's' : ''}). Sua ofensiva está salva!`]);
  } else if (S.streak > 0) {
    toastLater.push(['💔', `Sua ofensiva de ${S.streak} dias acabou. Bora começar outra hoje!`]);
    S.streak = 0;
  }
  save();
}
function practicedToday() { return S.last === today(); }

/* ---------------- hearts ---------------- */
function regenHearts() {
  if (S.hearts >= MAX_HEARTS) { S.heartsAt = Date.now(); return; }
  const n = Math.floor((Date.now() - S.heartsAt) / HEART_MS);
  if (n > 0) { S.hearts = Math.min(MAX_HEARTS, S.hearts + n); S.heartsAt += n * HEART_MS; if (S.hearts >= MAX_HEARTS) S.heartsAt = Date.now(); }
}
function nextHeartIn() { const ms = HEART_MS - (Date.now() - S.heartsAt); const m = Math.max(1, Math.ceil(ms / 60000)); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}min` : `${m} min`; }

/* ---------------- levels & leagues ---------------- */

/* ---------------- HTML sanitizer ---------------- */
const ALLOWED = new Set(['P','BR','B','STRONG','I','EM','U','SPAN','UL','OL','LI','SUB','SUP','IMG','DIV','SMALL','MARK','S']);
function clean(html) {
  const doc = new DOMParser().parseFromString(`<div>${html || ''}</div>`, 'text/html');
  const walk = el => {
    for (const ch of [...el.childNodes]) {
      if (ch.nodeType === 1) {
        if (!ALLOWED.has(ch.tagName)) { walk(ch); ch.replaceWith(...ch.childNodes); continue; }
        for (const a of [...ch.attributes]) {
          const ok = ch.tagName === 'IMG' && a.name === 'src' && /^https:\/\//i.test(a.value);
          if (!ok) ch.removeAttribute(a.name);
        }
        if (ch.tagName === 'IMG') { ch.setAttribute('loading', 'lazy'); ch.setAttribute('alt', ''); }
        walk(ch);
      } else if (ch.nodeType !== 3) ch.remove();
    }
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}
const plain = html => { const d = new DOMParser().parseFromString(html || '', 'text/html'); return (d.body.textContent || '').replace(/\s+/g, ' ').trim(); };

/* ---------------- import ---------------- */
function parseQuizHtml(text) {
  const m = text.match(/const\s+quizData\s*=\s*(\[[\s\S]*?\]);\s*\n/);
  if (!m) return null;
  try { return JSON.parse(m[1]); } catch (e) { return null; }
}
function unitFromDeck(text) {
  const m = text.match(/unitName=([^&"']+)/);
  if (!m) return null;
  const name = decodeURIComponent(m[1].replace(/\+/g, ' '));
  const n = name.match(/(\d+)/);
  return n ? parseInt(n[1], 10) : null;
}
function deckUrl(text) {
  const m = text.match(/href="(https:\/\/memhack\.io\/deck\/[^"]+)"/);
  return m ? m[1].replace(/&amp;/g, '&') : null;
}
/* entries: [{path, text()}] */
async function buildCourse(entries, onProgress) {
  const folders = new Map();
  let done = 0;
  for (const e of entries) {
    const parts = e.path.replace(/\\/g, '/').split('/');
    const file = parts[parts.length - 1];
    const folder = parts.length > 1 ? parts[parts.length - 2] : file.replace(/ - \d+-.*$/, '');
    const fm = folder.match(/^(\d+)\s*-\s*(.+)$/);
    const isQuiz = /Questoes\.html?$/i.test(file), isDeck = /Deck\.html?$/i.test(file);
    if (!fm || (!isQuiz && !isDeck)) continue;
    const num = parseInt(fm[1], 10);
    if (!folders.has(num)) folders.set(num, { num, title: fm[2].trim(), quizzes: [], decks: [], unit: null });
    const F = folders.get(num);
    const text = await e.text();
    if (isQuiz) {
      const data = parseQuizHtml(text);
      const pm = file.match(/ - (\d+)-Questoes/i);
      if (data && data.length) F.quizzes.push({ part: pm ? parseInt(pm[1], 10) : 0, data });
    } else {
      const u = unitFromDeck(text), url = deckUrl(text);
      if (u && !F.unit) F.unit = u;
      if (url) F.decks.push(url);
    }
    if (++done % 20 === 0) { onProgress && onProgress(done); await new Promise(r => setTimeout(r)); }
  }
  const nums = [...folders.keys()].sort((a, b) => a - b);
  const lessons = {}, order = [], units = [];
  let qcount = 0, keyed = 0;
  /* Unit grouping: the deck links carry "Unit NN", but a few are mislabeled.
     A new unit starts only when 3 lessons in a row agree on a new number;
     a big drop (e.g. 16 → 1) means a new level of the course. */
  const raw = nums.map(n => folders.get(n).unit);
  let curRaw = raw.find(x => x) || 1, unit = 1, level = 1;
  for (const [ix, n] of nums.entries()) {
    const F = folders.get(n), u = raw[ix];
    if (u && u !== curRaw && raw[ix + 1] === u && raw[ix + 2] === u) {
      if (u < curRaw - 3) level++;
      curRaw = u; unit++;
    }
    F.quizzes.sort((a, b) => a.part - b.part);
    F.quizzes.forEach((qz, i) => {
      const id = `${n}-${qz.part}`;
      const qs = qz.data.map(x => {
        const a = x.answer && x.answer.correct_option_id;
        if (a) keyed++;
        return {
          id: x.question_id,
          d: clean(x.description),
          m: x.media && x.media.url ? { t: x.media.type, u: x.media.url } : null,
          o: (x.options || []).map(o => ({ id: o.option_id, c: clean(o.content), img: o.image_url || '' })),
          a: a || null,
          f: x.answer && x.answer.feedback ? clean(x.answer.feedback) : null
        };
      }).filter(q => q.o.length >= 2);
      if (!qs.length) return;
      qcount += qs.length;
      lessons[id] = { id, num: n, title: F.title + (F.quizzes.length > 1 ? ` (parte ${i + 1})` : ''), unit, qs, deck: F.decks[0] || null, decks: F.decks };
      order.push(id);
      let U = units[units.length - 1];
      if (!U || U.n !== unit) { U = { n: unit, level, lessons: [] }; units.push(U); }
      U.lessons.push(id);
    });
  }
  return { v: 1, importedAt: Date.now(), lessons, order, units, qcount, keyed };
}
async function importFiles(fileList) {
  const files = [...fileList];
  const entries = [];
  for (const f of files) {
    if (/\.zip$/i.test(f.name)) {
      if (!window.JSZip) throw new Error('Não consegui carregar o leitor de ZIP. Verifique a internet e tente de novo (ou extraia o ZIP e importe a pasta).');
      const zip = await JSZip.loadAsync(f);
      zip.forEach((path, zf) => { if (!zf.dir && /\.html?$/i.test(path)) entries.push({ path, text: () => zf.async('string') }); });
    } else if (/\.html?$/i.test(f.name)) {
      entries.push({ path: f.webkitRelativePath || f.name, text: () => f.text() });
    }
  }
  if (!entries.length) throw new Error('Nenhum arquivo de questões encontrado. Escolha o arquivo materiais.zip ou a pasta "materiais".');
  const course = await buildCourse(entries, n => { const el = $('#impProg'); if (el) el.textContent = `Lendo arquivos… ${n}`; });
  if (!course.order.length) throw new Error('Não encontrei questões nesses arquivos. Os arquivos precisam terminar em "Questoes.html".');
  await db.set('course', course);
  C = course;
  return course;
}

function tone(seq) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    let t = AC.currentTime;
    for (const [f, d, type = 'sine', vol = .18] of seq) {
      const o = AC.createOscillator(), g = AC.createGain();
      o.type = type; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.start(t); o.stop(t + d + .02); t += d * .8;
    }
  } catch (e) {}
}

function confetti() {
  const cv = $('#confetti'); cv.hidden = false; const x = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#ff4f9a', '#ffc800', '#2fbf71', '#1cb0f6', '#a560ff', '#ff9600'];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 4, vy: 2 + Math.random() * 4, r: Math.random() * 6.28, vr: (Math.random() - .5) * .3, c: cols[(Math.random() * cols.length) | 0], w: 6 + Math.random() * 6 }));
  const t0 = performance.now();
  (function f(t) {
    x.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.vy += .05; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); x.restore(); }
    if (t - t0 < 3200) requestAnimationFrame(f); else { x.clearRect(0, 0, cv.width, cv.height); cv.hidden = true; }
  })(t0);
}

async function setupReminder(on) {
  if (on) {
    if (!('Notification' in window)) { toast('⚠️', 'Seu navegador não suporta notificações.'); return false; }
    const p = await Notification.requestPermission();
    if (p !== 'granted') { toast('🔕', 'Permissão de notificação negada.'); return false; }
    try {
      const reg = await navigator.serviceWorker.ready;
      if (reg.periodicSync) {
        const st = await navigator.permissions.query({ name: 'periodic-background-sync' }).catch(() => null);
        if (!st || st.state === 'granted') await reg.periodicSync.register('lembrete', { minInterval: 6 * 3600 * 1000 });
      }
    } catch (e) {}
  } else {
    try { const reg = await navigator.serviceWorker.ready; reg.periodicSync && await reg.periodicSync.unregister('lembrete'); } catch (e) {}
  }
  return true;
}

  const [h, m] = S.reminder.time.split(':').map(Number);

/* =========================================================
   LESSON ENGINE
   ========================================================= */
let LS = null; // lesson session
function makeSession(kind, qs, extra = {}) {
  return Object.assign({ kind, queue: qs.map(q => ({ q, retry: false })), total: qs.length, doneCount: 0, idx: 0, sel: null, checked: false,
    correct: 0, wrong: 0, answered: 0, combo: 0, maxCombo: 0, start: Date.now(), wrongIds: new Set(), lostAll: false }, extra);
}
function startLesson(id) {
  regenHearts();
  if (!isUnlocked(id)) return toast('🔒', 'Complete a aula anterior primeiro.');
  if (!S.unlimited && S.hearts <= 0) return showHearts();
  const L = C.lessons[id];
  LS = makeSession('lesson', L.qs, { lid: id, title: L.title });
  renderQ();
}
function allQ() { const m = {}; for (const id of C.order) for (const q of C.lessons[id].qs) m[q.id] = { q, lid: id }; return m; }
function startReview() {
  const M = allQ(); const ids = Object.keys(S.mistakes).filter(id => M[id]).slice(0, 10);
  if (!ids.length) return toast('🎉', 'Nada para revisar!');
  LS = makeSession('review', ids.map(id => M[id].q), { title: 'Revisão de erros' }); renderQ();
}
function pickRandom(n, needKey) {
  const pool = []; for (const id of C.order.filter(lessonDone)) for (const q of C.lessons[id].qs) if (!needKey || keyOf(q)) pool.push(q);
  for (let i = pool.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [pool[i], pool[j]] = [pool[j], pool[i]]; }
  return pool.slice(0, n);
}
function startQuick() { const qs = pickRandom(10); if (!qs.length) return; LS = makeSession('quick', qs, { title: 'Prática rápida' }); renderQ(); }
function startTimed() {
  let qs = pickRandom(60, true); if (qs.length < 3) qs = pickRandom(60);
  if (!qs.length) return;
  LS = makeSession('timed', qs, { title: 'Desafio relâmpago', deadline: Date.now() + 60000 });
  renderQ(); tickTimer();
}
function tickTimer() {
  if (!LS || LS.kind !== 'timed') return;
  const left = Math.max(0, LS.deadline - Date.now());
  const el = $('#timer'); if (el) el.textContent = `⏱️ ${Math.ceil(left / 1000)}s`;
  const b = $('#lbar'); if (b) b.style.width = `${left / 600}%`;
  if (left <= 0) return finishSession();
  LS.timer = setTimeout(tickTimer, 250);
}
const usesHearts = () => LS.kind === 'lesson' && !S.unlimited;

function renderQ() {
  const item = LS.queue[LS.idx]; if (!item) return finishSession();
  const q = item.q, key = keyOf(q);
  const pct = LS.kind === 'timed' ? Math.max(0, (LS.deadline - Date.now()) / 600) : LS.doneCount / LS.total * 100;
  const kindLabel = item.retry ? '🔁 Erro anterior' : !key ? '📝 Prática (sem gabarito)' : q.m && q.m.t === 'audio' ? '🎧 Escute e responda' : 'Escolha a resposta certa';
  app.innerHTML = `<div class="lesson">
    <div class="lhead"><button class="xbtn" onclick="quitLesson()" aria-label="Sair">✕</button><div class="bar"><i id="lbar" style="width:${pct}%;${LS.kind === 'timed' ? 'background:var(--red)' : ''}"></i></div>
    ${LS.kind === 'timed' ? `<span id="timer" class="stat" style="color:var(--red)">⏱️ ${Math.ceil((LS.deadline - Date.now()) / 1000)}s</span>` : usesHearts() ? `<span class="stat heart"><span class="ic">❤️</span>${S.hearts}</span>` : `<span class="stat heart"><span class="ic">💖</span>∞</span>`}</div>
    <div class="lbody">
      <div class="combo" id="combo">${LS.combo >= 3 ? `🔥 ${LS.combo} seguidas!` : ''}</div>
      <div class="qkind">${kindLabel}</div>
      ${q.m && q.m.t === 'audio' ? `<div style="display:flex;gap:10px;flex-wrap:wrap"><button class="audio-btn" onclick="playAudio(1)"><span class="ai">🔊</span>Ouvir</button><button class="audio-btn slow" onclick="playAudio(.75)"><span class="ai">🐢</span>Devagar</button></div><audio id="aud" preload="auto" src="${esc(q.m.u)}"></audio>` : ''}
      ${q.m && q.m.t === 'image' ? `<img src="${esc(q.m.u)}" alt="" style="max-width:100%;border-radius:14px;margin-bottom:12px">` : ''}
      <div class="qtext">${q.d}</div>
      <div class="opts">${q.o.map((o, i) => `<button class="opt" data-id="${esc(o.id)}" onclick="selOpt(this)"><span class="k">${i + 1}</span><span>${o.img ? `<img src="${esc(o.img)}" alt="" loading="lazy"><br>` : ''}${o.c}</span></button>`).join('')}</div>
    </div>
    <div class="lfoot" id="lfoot"><div class="lfoot-in"><button class="btn" id="checkBtn" disabled onclick="check()">Verificar</button></div></div>
  </div>`;
  LS.sel = null; LS.checked = false;
  if (q.m && q.m.t === 'audio') setTimeout(() => playAudio(1), 250);
}
function playAudio(rate) { const a = $('#aud'); if (!a) return; try { a.currentTime = 0; a.playbackRate = rate; a.play().catch(() => {}); } catch (e) {} }
function selOpt(el) {
  if (LS.checked) return;
  document.querySelectorAll('.opt').forEach(o => o.classList.remove('sel'));
  el.classList.add('sel'); LS.sel = el.dataset.id; sfx.tap();
  $('#checkBtn').disabled = false;
}
function check() {
  if (LS.checked || !LS.sel) return;
  LS.checked = true;
  const item = LS.queue[LS.idx], q = item.q, key = keyOf(q);
  document.querySelectorAll('.opt').forEach(o => { o.disabled = true; o.classList.remove('sel'); });
  const foot = $('#lfoot'), timed = LS.kind === 'timed';
  LS.answered++; S.answered++;
  questProgress('answers', 1);
  if (!key) {
    LS.doneCount++; LS.correct++;
    foot.className = 'lfoot neu';
    foot.innerHTML = `<div class="lfoot-in"><div class="fb-title">📝 Resposta registrada</div><div class="fb-text">Esta questão não tem gabarito no material. Se você tem certeza da resposta, marque como certa — ela passa a ser corrigida nas próximas vezes.</div>
      <button class="linkbtn" onclick="markKey('${esc(q.id)}','${esc(LS.sel)}',this)">✓ Marcar minha resposta como a certa</button>
      <button class="btn purple" onclick="next()">Continuar</button></div>`;
    sfx.tap();
    return;
  }
  const ok = LS.sel === key;
  const selEl = document.querySelector(`.opt[data-id="${CSS.escape(LS.sel)}"]`), keyEl = document.querySelector(`.opt[data-id="${CSS.escape(key)}"]`);
  if (ok) {
    selEl && selEl.classList.add('right');
    LS.correct++; S.correct++; LS.combo++; LS.maxCombo = Math.max(LS.maxCombo, LS.combo); LS.doneCount++;
    if (S.mistakes[q.id] && !item.retry) { S.mistakes[q.id].ok = (S.mistakes[q.id].ok || 0) + 1; if (S.mistakes[q.id].ok >= 2) delete S.mistakes[q.id]; }
    sfx.ok();
    const praise = ['Muito bem!', 'Incrível!', 'Mandou bem!', 'Perfeito!', 'Isso aí!', 'Arrasou!'][(Math.random() * 6) | 0];
    foot.className = 'lfoot ok';
    foot.innerHTML = `<div class="lfoot-in"><div class="fb-title">✅ ${praise}</div>${q.f ? `<div class="fb-text">${q.f}</div>` : ''}<button class="btn green" id="nextBtn" onclick="next()">Continuar</button></div>`;
    const c = $('#combo'); if (c && LS.combo >= 3) c.textContent = `🔥 ${LS.combo} seguidas!`;
  } else {
    selEl && selEl.classList.add('wrong'); keyEl && keyEl.classList.add('right');
    LS.wrong++; LS.combo = 0; LS.wrongIds.add(q.id);
    S.mistakes[q.id] = { ok: 0, at: Date.now() };
    if (usesHearts()) { regenHearts(); if (S.hearts === MAX_HEARTS) S.heartsAt = Date.now(); S.hearts = Math.max(0, S.hearts - 1); }
    if (!timed && !item.retry) LS.queue.push({ q, retry: true });
    else if (!timed) LS.doneCount++; // second miss: move on
    sfx.bad();
    const ans = q.o.find(o => o.id === key);
    foot.className = 'lfoot bad';
    foot.innerHTML = `<div class="lfoot-in"><div class="fb-title">❌ Resposta correta:</div><div class="fb-text">${ans ? ans.c : ''}${q.f ? `<br><span class="muted">${q.f}</span>` : ''}</div><button class="btn red" id="nextBtn" onclick="next()">Continuar</button></div>`;
  }
  if (timed) LS.doneCount++;
  save();
  if (timed) setTimeout(() => { if (LS && LS.checked) next(); }, ok ? 450 : 1100);
}
function markKey(qid, oid, el) { S.userKeys[qid] = oid; save(); el.textContent = '✓ Marcada como gabarito'; el.disabled = true; toast('📌', 'Gabarito salvo neste aparelho.'); }
function next() {
  if (!LS) return;
  if (usesHearts() && S.hearts <= 0) { LS.lostAll = true; return outOfHearts(); }
  LS.idx++;
  if (LS.idx >= LS.queue.length) return finishSession();
  renderQ();
}
function outOfHearts() {
  save();
  popup(`<div class="center"><div style="font-size:64px">💔</div><h3>Acabaram suas vidas</h3><p class="muted">Recupere vidas para continuar esta lição.</p>
    <button class="btn" onclick="refillAndContinue()">Recarregar (💎 50)</button><div style="height:10px"></div>
    <button class="btn ghost" onclick="this.closest('.pop').remove();LS=null;tab='practice';render()">Sair e treinar</button></div>`);
}
function refillAndContinue() {
  if (S.gems < 50) return toast('💎', 'Gemas insuficientes!');
  S.gems -= 50; S.hearts = MAX_HEARTS; save(); document.querySelector('.pop')?.remove(); LS.idx++; LS.idx >= LS.queue.length ? finishSession() : renderQ();
}
function quitLesson() {
  popup(`<div class="center"><div style="font-size:56px">🥺</div><h3>Quer mesmo sair?</h3><p class="muted">Você vai perder o progresso desta lição.</p>
  <button class="btn" onclick="this.closest('.pop').remove()">Continuar estudando</button><div style="height:10px"></div>
  <button class="btn ghost" style="color:var(--red)" onclick="this.closest('.pop').remove();clearTimeout(LS&&LS.timer);LS=null;render()">Sair</button></div>`);
}

function finishSession() {
  clearTimeout(LS.timer);
  const s = LS, secs = Math.round((Date.now() - s.start) / 1000);
  const graded = s.correct + s.wrong;
  const acc = s.answered ? Math.round(s.correct / Math.max(1, s.answered) * 100) : 0;
  const perfect = s.wrong === 0 && s.answered > 0 && s.kind !== 'timed';
  let xp, gems = 0, firstTime = false;
  if (s.kind === 'timed') xp = s.correct * 4;
  else { xp = Math.max(10, s.correct * 2) + (perfect ? 5 : 0) + Math.floor(s.maxCombo / 5) * 2; }
  if (s.kind === 'lesson') {
    const prev = S.lessons[s.lid] || {};
    firstTime = !prev.done || prev.skipped;
    if (!firstTime) xp = Math.ceil(xp / 2);
    const st = acc >= 90 ? 3 : acc >= 70 ? 2 : 1;
    S.lessons[s.lid] = { done: true, stars: Math.max(prev.skipped ? 0 : prev.stars || 0, st), best: Math.max(prev.skipped ? 0 : prev.best || 0, acc), attempts: (prev.attempts || 0) + 1 };
    S.lessonsDone++;
    gems += 5 + (perfect ? 10 : 0);
    questProgress('lessons', 1);
  } else {
    if (S.hearts < MAX_HEARTS) S.hearts++;
    if (s.kind === 'review') questProgress('review', 1);
    gems += 3;
  }
  if (perfect) { S.perfect++; questProgress('perfect', 1); }
  const boosted = S.boostUntil > Date.now(); if (boosted) xp *= 2;
  S.bestCombo = Math.max(S.bestCombo, s.maxCombo); questProgress('combo', s.maxCombo, 'max');
  const before = levelOf(S.xp), t = today(), hadGoal = (S.days[t] || 0) >= S.goal;
  S.xp += xp; S.days[t] = (S.days[t] || 0) + xp; questProgress('xp', xp);
  // streak
  let streakUp = false;
  if (S.last !== t) {
    const gap = S.last ? daysBetween(S.last, t) : 99;
    S.streak = gap === 1 ? S.streak + 1 : 1; S.last = t; streakUp = true; S.best = Math.max(S.best, S.streak);
    if (S.streak % 7 === 0) { gems += 20; toastLater.push(['🎁', `${S.streak} dias de ofensiva! +20 💎`]); }
  }
  const goalNow = !hadGoal && S.days[t] >= S.goal;
  if (goalNow) gems += 10;
  S.gems += gems;
  checkAch();
  const lvlUp = levelOf(S.xp) > before;
  save(); LS = null;
  sfx.win(); confetti();
  const steps = [];
  app.innerHTML = `<div class="result">
    <div class="big">${s.kind === 'timed' ? '⏱️' : perfect ? '🏆' : acc >= 70 ? '🎉' : '💪'}</div>
    <h1>${s.kind === 'timed' ? `${s.correct} acertos em 60s!` : perfect ? 'Lição perfeita!' : s.kind === 'lesson' ? 'Lição concluída!' : 'Treino concluído!'}</h1>
    <p class="muted" style="margin:0">${esc(s.title)}</p>
    <div class="rstats">
      <div class="rstat x"><div class="rt">XP total</div><div class="rv">⚡${xp}</div></div>
      <div class="rstat a"><div class="rt">${graded ? 'Precisão' : 'Respostas'}</div><div class="rv">🎯${graded ? acc + '%' : s.answered}</div></div>
      <div class="rstat t"><div class="rt">Tempo</div><div class="rv">⏱️${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}</div></div>
    </div>
    <p style="margin:0 0 6px">💎 +${gems} gemas${boosted ? ' • ⚡ XP em dobro' : ''}${s.kind !== 'lesson' ? ' • ❤️ +1 vida' : ''}</p>
    ${lvlUp ? `<p style="color:var(--gold-d);font-size:18px">⭐ Subiu para o nível ${levelOf(S.xp)}!</p>` : ''}
    ${goalNow ? `<p style="color:var(--green)">✅ Meta diária batida!</p>` : ''}
    <div style="width:100%;margin-top:auto"><button class="btn" onclick="afterResult(${streakUp})">Continuar</button></div>
  </div>`;
}
function afterResult(streakUp) {
  if (streakUp) {
    app.innerHTML = `<div class="result"><div class="big" style="font-size:110px">🔥</div><h1 style="color:#ff9600;font-size:46px;margin:0">${S.streak}</h1><h1 style="color:#ff9600;margin-top:0">dia${S.streak > 1 ? 's' : ''} de ofensiva!</h1>
      <div class="cal" style="width:100%;max-width:320px;margin:18px 0">${Array.from({ length: 7 }, (_, i) => { const k = addDays(today(), i - 6); return `<div class="d ${S.days[k] ? 'on' : S.frozenDays.includes(k) ? 'fz' : ''} ${i === 6 ? 'today' : ''}">${'DSTQQSS'[new Date(k + 'T12:00').getDay()]}</div>`; }).join('')}</div>
      <p class="muted">Volte amanhã para continuar a sequência!</p>
      <div style="width:100%;margin-top:auto"><button class="btn" onclick="tab='path';render();flushToasts();setTimeout(scrollToCurrent,80)">Continuar</button></div></div>`;
    tone([[660, .1], [880, .1], [1100, .25]]);
    return;
  }
  render(); flushToasts(); if (tab === 'path') setTimeout(scrollToCurrent, 80);
}

/* keyboard shortcuts (desktop) */
document.addEventListener('keydown', e => {
  if (!LS) return;
  if (/^[1-9]$/.test(e.key) && !LS.checked) { const o = document.querySelectorAll('.opt')[+e.key - 1]; o && selOpt(o); }
  if (e.key === 'Enter') { if (!LS.checked) $('#checkBtn') && !$('#checkBtn').disabled && check(); else next(); }
});

/* =========================================================
   BOOT
   ========================================================= */
(async function boot() {
  loadState();
  try { const st = await db.get('state'); if (st && (!S.created || (st.xp || 0) > (S.xp || 0))) S = Object.assign(defaultState(), st); } catch (e) {}
  applyTheme();
  try { C = await db.get('course') || null; } catch (e) { C = null; }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  settleStreak(); regenHearts();
  if (C) checkAch();
  const p = new URLSearchParams(location.search).get('go');
  render();
  if (C && S.name) {
    if (p === 'continue') startLesson(currentLesson());
    else if (p === 'review') { tab = 'practice'; render(); if (Object.keys(S.mistakes).length) startReview(); }
    else if (p === 'quests') { tab = 'quests'; render(); }
    else setTimeout(scrollToCurrent, 120);
  }
  flushToasts(); scheduleInAppReminder(); updateBadge();
  setInterval(() => { if (!LS && C && S.name && !document.querySelector('.pop')) { const h = S.hearts; regenHearts(); if (h !== S.hearts) { save(); render(); } } }, 60000);
})();
</script>
</body>
