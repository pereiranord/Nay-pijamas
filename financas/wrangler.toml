name = "financas"
main = "src/worker.js"
compatibility_date = "2026-11-01"

# Painel single-file. Os assets respondem antes do Worker; /api/* cai no Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "financas"
database_id = "COLE_AQUI_O_ID_DO_D1"

# 11:00 UTC = 08:00 em Sao Paulo. O Meu Pluggy atualiza a cada 24h,
# entao sincronizar uma vez por dia pela manha e suficiente.
[triggers]
crons = ["0 11 * * *"]

[vars]
PLUGGY_ITEM_IDS = ""          # itemIds do Meu Pluggy, separados por virgula
BACKFILL_FROM = "2025-01-01"  # inicio da carga historica
ACCOUNT_LABELS = ""           # opcional: "accountId=Nubank,accountId=Itau"

[observability]
enabled = true
