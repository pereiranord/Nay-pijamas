name: TV Drop APK

on:
  push:
    paths:
      - "tv-drop/**"
      - ".github/workflows/tv-drop.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-35" > /dev/null

      - name: Assistant tests
        run: node tv-drop/test/assistant.test.js

      - name: Game room tests
        run: node tv-drop/test/gamer-room.test.js && node tv-drop/test/bomb-logic.test.js

      - name: Standalone index.html
        run: |
          mkdir -p tv-drop/build
          python3 tv-drop/tools/build_web.py tv-drop/build/index.html

      # The signing key lives only in the repository secrets (never in git). Without it the build keeps the
      # original key; see tv-drop/docs/ASSINATURA.md.
      - name: Signing key (when configured)
        env:
          KEY_B64: ${{ secrets.TVDROP_SIGNING_KEY_B64 }}
        run: |
          if [ -n "$KEY_B64" ]; then
            echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/tvdrop-signing.jks"
            echo "TVDROP_SIGNING_KEY=$RUNNER_TEMP/tvdrop-signing.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::TVDROP_SIGNING_KEY_B64 is not set: signing with the original key (tv-drop/docs/ASSINATURA.md)"
          fi

      - name: Build
        env:
          TVDROP_SIGNING_PASS: ${{ secrets.TVDROP_SIGNING_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 2.12.${{ github.run_number }}
        run: ./tv-drop/build.sh

      - name: Show failed tests
        if: failure()
        run: |
          grep -l "<failure\|<error" tv-drop/build/test-results/testTvReleaseUnitTest/*.xml 2>/dev/null | while read f; do
            echo "== $f"; grep -A8 "<failure\|<error" "$f" | head -40
          done

      - uses: actions/upload-artifact@v4
        with:
          name: TV-Drop
          path: |
            tv-drop/build/TV-Drop.apk
            tv-drop/build/TV-Drop-Celular.apk
            tv-drop/build/SHA256SUMS.txt
            tv-drop/build/SIGNING.txt

      - name: Release notes
        run: bash tv-drop/tools/release_notes.sh "2.12.${{ github.run_number }}" tv-drop/build > tv-drop/build/RELEASE_NOTES.md

      - name: Remove the signing key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/tvdrop-signing.jks"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-drop-v2.12.${{ github.run_number }}
          name: TV Drop 2.12.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body_path: tv-drop/build/RELEASE_NOTES.md
          files: |
            tv-drop/build/TV-Drop.apk
            tv-drop/build/TV-Drop-Celular.apk
            tv-drop/build/SHA256SUMS.txt
            tv-drop/build/SIGNING.txt
            tv-drop/build/index.html
